<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — Mailora AI</title>

  <!-- FAVICON & BRAND ASSETS -->
  <link rel="icon" type="image/png" href="./mailora_brand/favicon.png" />
  <link rel="shortcut icon" href="./mailora_brand/favicon.ico" />
  <link rel="apple-touch-icon" href="./mailora_brand/apple-icon.png" />

  <!-- TAILWIND CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="bg-gray-950 font-['Plus_Jakarta_Sans',sans-serif] text-white min-h-screen flex flex-col justify-between items-center relative overflow-x-hidden selection:bg-blue-600 selection:text-white px-4 py-8 sm:py-10">

  <!-- ===================================================================== -->
  <!-- 1. LOGO GÓC TRÊN CÙNG BÊN TRÁI                                       -->
  <!-- ===================================================================== -->
  <header class="w-full max-w-7xl flex items-center justify-between z-20">
    <a href="index.html" class="inline-flex items-center gap-2.5 transition opacity-95 hover:opacity-100 group" title="Về trang chủ Mailora">
      <img 
        src="./mailora_brand/mailora-logo-transparent.png" 
        alt="Mailora Logo" 
        class="h-8 sm:h-9 w-auto object-contain"
        onerror="this.onerror=null; this.src='./mailora-brand/mailora-logo-transparent.png'; if(!this.complete || this.naturalWidth===0){this.style.display='none'; document.getElementById('logo-fallback').classList.remove('hidden');}"
      />
      <div id="logo-fallback" class="hidden items-center gap-2">
        <img src="./mailora_brand/logo-mark.png" alt="Mailora" class="h-8 w-auto object-contain" onerror="this.src='./mailora-brand/logo-mark.png'" />
        <span class="text-2xl font-extrabold tracking-tight text-white lowercase">mailora</span>
        <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-gradient-to-r from-purple-400 via-amber-300 to-amber-500 text-slate-950">AI</span>
      </div>
    </a>
  </header>

  <!-- ===================================================================== -->
  <!-- 2. KHUNG ĐĂNG NHẬP (WHITE CARD CĂN GIỮA HOÀN HẢO)                    -->
  <!-- ===================================================================== -->
  <main class="w-full max-w-md my-auto py-6">
    <div class="bg-white text-gray-900 rounded-2xl sm:rounded-3xl p-7 sm:p-9 shadow-2xl shadow-black/50 border border-gray-100">
      
      <!-- Tiêu đề & Phụ đề -->
      <div class="mb-6">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight">
          Đăng nhập
        </h1>
        <p class="text-sm text-gray-500 mt-1.5 font-medium">
          Tiếp tục truy cập Mailora
        </p>
      </div>

      <!-- Form nhập Email -->
      <form action="AI_creative_studio.html" method="GET" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-700 mb-1.5">
            Email
          </label>
          <input 
            type="email" 
            id="email" 
            name="email"
            required 
            placeholder="name@company.com" 
            class="w-full px-4 py-3 rounded-xl border border-gray-300 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-100 transition duration-150"
          />
        </div>

        <!-- Nút bấm chính: Tiếp tục bằng email -->
        <button 
          type="submit" 
          class="w-full py-3.5 px-4 bg-gray-900 hover:bg-black active:scale-[0.99] text-white text-sm font-bold rounded-xl transition duration-150 shadow-sm cursor-pointer flex items-center justify-center"
        >
          Tiếp tục bằng email
        </button>
      </form>

      <!-- Dải phân cách 'hoặc' -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-xs">
          <span class="bg-white px-3 text-gray-400 font-medium">hoặc</span>
        </div>
      </div>

      <!-- Tùy chọn đăng nhập: Mã khóa (Passkey) -->
      <div class="space-y-3">
        <button 
          type="button" 
          onclick="window.location.href='AI_creative_studio.html'"
          class="w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 active:scale-[0.99] text-gray-800 text-sm font-semibold rounded-xl transition duration-150 flex items-center justify-center gap-2.5 cursor-pointer"
        >
          <!-- Biểu tượng hình người / chìa khóa -->
          <svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <svg class="w-4 h-4 text-gray-700 -ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
          </svg>
          <span>Đăng nhập bằng mã khóa</span>
        </button>

        <!-- Hàng 4 nút: Google, Apple, Facebook, WhatsApp -->
        <div class="grid grid-cols-4 gap-3">
          <!-- 1. Google -->
          <button 
            type="button" 
            title="Đăng nhập với Google"
            onclick="window.location.href='AI_creative_studio.html'"
            class="h-12 flex items-center justify-center bg-gray-100 hover:bg-gray-200 active:scale-95 rounded-xl transition duration-150 cursor-pointer"
          >
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
            </svg>
          </button>

          <!-- 2. Apple -->
          <button 
            type="button" 
            title="Đăng nhập với Apple"
            onclick="window.location.href='AI_creative_studio.html'"
            class="h-12 flex items-center justify-center bg-gray-100 hover:bg-gray-200 active:scale-95 rounded-xl transition duration-150 cursor-pointer"
          >
            <svg class="w-5 h-5 fill-current text-gray-900" viewBox="0 0 24 24">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 0.93-2.85-.9.04-1.98.6-2.62 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.02-.49 2.63-1.24z" />
            </svg>
          </button>

          <!-- 3. Facebook -->
          <button 
            type="button" 
            title="Đăng nhập với Facebook"
            onclick="window.location.href='AI_creative_studio.html'"
            class="h-12 flex items-center justify-center bg-gray-100 hover:bg-gray-200 active:scale-95 rounded-xl transition duration-150 cursor-pointer"
          >
            <svg class="w-5 h-5 fill-[#1877F2]" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
            </svg>
          </button>

          <!-- 4. WhatsApp -->
          <button 
            type="button" 
            title="Đăng nhập với WhatsApp"
            onclick="window.location.href='AI_creative_studio.html'"
            class="h-12 flex items-center justify-center bg-gray-100 hover:bg-gray-200 active:scale-95 rounded-xl transition duration-150 cursor-pointer"
          >
            <svg class="w-5 h-5 fill-[#25D366]" viewBox="0 0 24 24">
              <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86.173.086.275.072.376-.044.101-.116.433-.506.549-.68.116-.173.231-.145.39-.086s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.12.553 4.11 1.517 5.84l-1.617 5.908 6.079-1.595c1.669.914 3.585 1.447 5.621 1.447 6.627 0 12-5.373 12-12 0-6.627-5.373-12-12-12z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Footer của thẻ: Link Bắt đầu -->
      <div class="mt-8 pt-5 border-t border-gray-100 text-center">
        <p class="text-xs sm:text-sm text-gray-500 font-medium">
          Bạn mới sử dụng Mailora? 
          <a href="sign_up.html" class="text-blue-600 hover:text-blue-700 font-semibold hover:underline inline-flex items-center gap-0.5 ml-1">
            <span>Bắt đầu</span>
            <span>&rarr;</span>
          </a>
        </p>
      </div>

    </div>
  </main>

  <!-- ===================================================================== -->
  <!-- 3. FOOTER DƯỚI CÙNG MÀN HÌNH (NGOÀI KHUNG TRẮNG)                      -->
  <!-- ===================================================================== -->
  <footer class="w-full max-w-xl text-center space-y-2 z-20">
    <div>
      <a href="#" class="text-xs text-gray-400 hover:text-gray-200 transition font-medium hover:underline">
        Bạn cần trợ giúp?
      </a>
    </div>
    <p class="text-[11px] leading-relaxed text-gray-500 max-w-md mx-auto">
      Bằng việc nhấp vào tạo tài khoản, bạn đồng ý với <a href="#" class="underline hover:text-gray-300">Điều khoản</a> và <a href="#" class="underline hover:text-gray-300">Chính sách bảo mật</a>, cũng như nhận email tiếp thị từ Mailora. Hủy đăng ký bất cứ lúc nào.
    </p>
  </footer>

</body>
</html>
